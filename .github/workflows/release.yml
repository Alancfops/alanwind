# CD: publishing a version (D142).
# Alan creates the tag vX.Y.Z on main after merging develop -> main. This
# workflow then checks the tag, sets that single version on every public
# package, runs the same checks as the CI, publishes to npm with provenance
# and creates the GitHub Release with notes generated from the commits.
# Auth: NPM_TOKEN secret for the first publish; later, npm trusted publishing
# (OIDC) replaces it and the token is removed.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must point to a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main."
            exit 1
          fi

      - name: Monorepo must exist
        run: |
          if [[ ! -f pnpm-lock.yaml ]]; then
            echo "::error::No pnpm-lock.yaml: nothing to publish yet."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Set version on every public package
        run: node .github/scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Checks (same as CI)
        run: |
          node .github/scripts/check-docs.mjs
          pnpm exec biome ci .
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - name: Publish
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
